name: Issue intake

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Resolve exact trusted processor revision
        id: processor
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          processor_sha=$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH}" --jq '.sha')
          printf 'sha=%s\n' "${processor_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted processor revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.processor.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify processor revision
        env:
          PROCESSOR_SHA: ${{ steps.processor.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PROCESSOR_SHA}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Capture event revision
        env:
          REAL_EVENT: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          printf '%s' "${REAL_EVENT}" > event.json

      - name: Normalize issue intake
        env:
          PROCESSOR_SHA: ${{ steps.processor.outputs.sha }}
        run: |
          set -euo pipefail
          python tools/governance_intake.py issue \
            --event event.json \
            --processor-sha "${PROCESSOR_SHA}" \
            --output-json intake-record.json \
            --output-md intake-summary.md
          cat intake-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload revision-bound intake
        uses: actions/upload-artifact@v7
        with:
          name: issue-intake-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            intake-record.json
            intake-summary.md
          retention-days: 30
          if-no-files-found: error

name: Governance observe

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-observe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Observe governance consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate in advisory mode
        # --expected-sha is deliberately not passed here: this job checks out
        # the event SHA, so asserting HEAD against that same SHA cannot fail and
        # proves nothing. The option remains available for a maintainer (or a
        # future approval-binding gate) to verify a separately claimed revision.
        run: >-
          python tools/validate_governance.py
          --advisory
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Exercise validator tests in advisory mode
        shell: bash
        run: |
          if ! python -m unittest test.test_governance_validator -v; then
            echo "::warning file=test/test_governance_validator.py::Governance validator tests failed in observe mode."
          fi

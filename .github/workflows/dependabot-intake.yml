name: Dependabot intake

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-intake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.sender.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify processor revision
        env:
          PROCESSOR_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PROCESSOR_SHA}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Retrieve head-bound metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          REAL_EVENT: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          printf '%s' "${REAL_EVENT}" > raw-event.json
          head_before=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [ "${head_before}" = "${EVENT_HEAD}" ]; then
            gh api --paginate --slurp "repos/${REPO}/pulls/${PR_NUMBER}/files" > files.json
          else
            printf '[]\n' > files.json
          fi
          head_after=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          jq --arg before "${head_before}" --arg after "${head_after}" \
            '. + {intake_observation: {head_before: $before, head_after: $after}}' \
            raw-event.json > event.json

      - name: Normalize Dependabot intake
        env:
          PROCESSOR_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python tools/governance_intake.py dependabot \
            --event event.json \
            --files files.json \
            --processor-sha "${PROCESSOR_SHA}" \
            --output-json intake-record.json \
            --output-md intake-summary.md
          cat intake-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload head-bound intake
        uses: actions/upload-artifact@v7
        with:
          name: dependabot-intake-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            intake-record.json
            intake-summary.md
          retention-days: 30
          if-no-files-found: error

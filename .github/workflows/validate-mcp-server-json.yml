name: Validate MCP server.json

# Disabled in the Klok fork (klok-opensource/klok-avrotize).
# Klok does not publish avrotize to the MCP registry, and this job downloads mcp-publisher
# from the internet on every pull request.
# The original trigger is kept below, commented out, so that an upstream sync merge
# still shows a conflict here if upstream changes it. See KLOK.md.
#
# on:
#   pull_request:
#     branches: [ master ]
#   workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-server-json:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install mcp-publisher
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
        chmod +x ./mcp-publisher

    - name: Validate server.json
      run: ./mcp-publisher validate server.json
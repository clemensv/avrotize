name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Upload Python Package and VS Code Extension
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    steps:
      - name: Resolve pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          author="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login')"
          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" --name-only |
              grep -q '^\.github/workflows/'; then
            echo "Workflow updates require a maintainer merge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$REPOSITORY/pull/$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for remaining checks
        if: steps.pull-request.outputs.eligible == 'true'
        run: gh pr checks "$PR_URL" --watch --fail-fast
        env:
          PR_URL: ${{ steps.pull-request.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash and merge
        if: steps.pull-request.outputs.eligible == 'true'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ steps.pull-request.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

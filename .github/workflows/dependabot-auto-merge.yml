# Dependabot policy guard (read-only)
#
# BEHAVIORAL CHANGE (2026-08-17): This workflow was previously an auto-merge
# automation that squash-merged eligible Dependabot PRs after checks passed.
# It has been converted to a read-only policy guard that summarizes Dependabot
# PR eligibility without performing any merge, branch deletion, or write
# mutation. Dependabot PRs are intake and require explicit owner authorization
# before merge, like any other change.
#
# The file is retained at this path for explicit migration visibility.

name: Dependabot policy guard

on:
  workflow_run:
    workflows:
      - Upload Python Package and VS Code Extension
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

jobs:
  policy-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    steps:
      - name: Resolve pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          author="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login')"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize policy
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.pr_number }}
          IS_DEPENDABOT: ${{ steps.pull-request.outputs.is_dependabot }}
          AUTHOR: ${{ steps.pull-request.outputs.author }}
        run: |
          echo "## Dependabot Policy Guard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Author: ${AUTHOR}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Is Dependabot: ${IS_DEPENDABOT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build workflow: success" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> This workflow is a read-only policy guard. Automatic merge is" >> "$GITHUB_STEP_SUMMARY"
          echo "> disabled. Dependabot PRs require explicit owner authorization" >> "$GITHUB_STEP_SUMMARY"
          echo "> before merge." >> "$GITHUB_STEP_SUMMARY"

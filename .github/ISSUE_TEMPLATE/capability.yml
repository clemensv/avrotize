name: Conversion capability
description: Propose an additive conversion cell, option, target, or public interface.
title: "[Capability] "
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Primary delivery lane
      options:
        - Core model
        - Importers
        - Schema exporters and specifications
        - Code generators
        - Data platforms
        - Public interfaces
        - Packaging and release
    validations:
      required: true
  - type: textarea
    id: cells
    attributes:
      label: Proposed conversion cells
      description: Identify source/version, intermediate model, target, options/defaults, runtime/toolchain, Python cohort, and interface/artifact surfaces.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Hard dependencies and campaign needs
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Frozen acceptance manifest
      description: Define positive, invalid, boundary, intermediate/semantic, round-trip, generated-runtime, interface, and documentation evidence.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility, migration, security, and release impact
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness confirmations
      options:
        - label: Defaults and supported options are explicit.
          required: true
        - label: I understand that the repository owner must authorize and rank this work.
          required: true

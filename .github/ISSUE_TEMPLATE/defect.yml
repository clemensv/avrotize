name: Defect
description: Report reproducible behavior that differs from the documented contract.
title: "[Defect] "
labels: []
body:
  - type: markdown
    attributes:
      value: Intake is not implementation authorization. Do not include sensitive data.
  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
      description: State the behavior that should be restored.
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Primary delivery lane
      options:
        - Core model
        - Importers
        - Schema exporters and specifications
        - Code generators
        - Data platforms
        - Public interfaces
        - Packaging and release
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include version, command/API/surface, source and target formats, options, runtime/toolchain, and minimal input.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: cells
    attributes:
      label: Affected conversion cells and neighbors
      description: Identify source, intermediate representation, target, options, generated runtime, and interfaces.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Hard dependencies
      description: Link structural prerequisites, or write "None known".
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance manifest and evidence plan
      description: List positive, invalid, boundary, round-trip, generated-runtime, and interface evidence.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Regression, compatibility, security, and release risk
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness confirmations
      options:
        - label: I supplied a minimal non-sensitive reproducer.
          required: true
        - label: I understand that the repository owner must authorize and rank this work.
          required: true

"""
An order placed by a customer.
"""
type Order {
  """The unique identifier for the order."""
  OrderID: Int!
  """The ID of the customer who placed the order."""
  CustomerID: String
  """The ID of the employee who handled the order."""
  EmployeeID: Int
  """The date the order was placed."""
  OrderDate: Date
  """The date the order is required by."""
  RequiredDate: Date
  """The date the order was shipped."""
  ShippedDate: Date
  """The ID of the shipper."""
  ShipVia: Int
  """The freight charges for the order."""
  Freight: Float
  """The name of the recipient."""
  ShipName: String
  """The address where the order is to be shipped."""
  ShipAddress: String
  """The city where the order is to be shipped."""
  ShipCity: String
  """The region where the order is to be shipped."""
  ShipRegion: String
  """The postal code where the order is to be shipped."""
  ShipPostalCode: String
  """The country where the order is to be shipped."""
  ShipCountry: String
}
"""
Details of a product included in an order.
"""
type OrderDetail {
  """The ID of the order."""
  OrderID: Int!
  """The ID of the product."""
  ProductID: Int!
  """The price per unit of the product."""
  UnitPrice: Float!
  """The quantity of the product ordered."""
  Quantity: Int!
  """The discount applied to the product."""
  Discount: Float!
}
"""
A product available for sale.
"""
type Product {
  """The unique identifier for the product."""
  ProductID: Int!
  """The name of the product."""
  ProductName: String!
  """The ID of the supplier of the product."""
  SupplierID: Int
  """The ID of the category the product belongs to."""
  CategoryID: Int
  """The quantity of the product per unit."""
  QuantityPerUnit: String
  """The price per unit of the product."""
  UnitPrice: Float
  """The number of units in stock."""
  UnitsInStock: Int
  """The number of units on order."""
  UnitsOnOrder: Int
  """The reorder level for the product."""
  ReorderLevel: Int
  """Whether the product is discontinued."""
  Discontinued: Boolean!
}
